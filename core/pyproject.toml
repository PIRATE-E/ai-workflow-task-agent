[project]
name = "coldwind-core"
version = "1.9.1"
description = "Cold Wind AI — shared agent core, MCP protocol, tools, RAG"
requires-python = ">=3.13"
dependencies = [
    # ── Core LangChain / LangGraph Engine ──
    "langchain-core>=0.3.74",
    "langgraph>=0.6.6",
    "langchain-ollama>=0.3.6",
    "openai>=1.100.2",
    "ollama>=0.5.3",
    "mcp>=1.13.0",

    # ── Settings & State Models ──
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",

    # ── Knowledge Base & Utilities ──
    "neo4j>=5.28.2",
    "tenacity>=9.1.2",
    "python-dotenv>=1.1.1",
    "duckduckgo-search>=8.1.1",

    # -------------------------------------------------------------------------
    # WHAT CHANGED & WHY (LSP & Environment Optimization):
    # Commented out dead umbrella packages, redundant transitive dependencies,
    # and legacy RAG libraries.
    # WHY:
    # 1. langchain, langchain-community: Massive umbrellas pulling sqlalchemy,
    #    greenlet, and dataclasses-json; active Core only uses langchain-core.
    # 2. langchain-mcp-adapters, langgraph-checkpoint, langgraph-prebuilt, langgraph-sdk:
    #    0 imports across active Core (we use custom native stdio MCP & ToolAssign).
    # 3. langsmith, pydantic-core: Already automatic transitive deps of core packages.
    # 4. numpy, networkx, pypdf, pyyaml: 0 imports in active Core/Desktop.
    # 5. chromadb, google-generativeai: Heavy transitive trees (onnxruntime, grpcio)
    #    that slow down Basedpyright LSP; legacy RAG has graceful try/except guards.
    # -------------------------------------------------------------------------
    # "langchain>=0.3.27",
    # "langchain-community>=0.3.27",
    # "langchain-mcp-adapters>=0.1.9",
    # "langchain-text-splitters>=0.3.9",
    # "langgraph-checkpoint>=2.1.1",
    # "langgraph-prebuilt>=0.6.4",
    # "langgraph-sdk>=0.2.2",
    # "langsmith>=0.4.14",
    # "pydantic-core>=2.33.2",
    # "numpy>=2.3.2",
    # "chromadb>=1.0.20",
    # "pypdf>=6.0.0",
    # "networkx>=3.5",
    # "pyyaml>=6.0.2",
    # "google-generativeai>=0.8.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/coldwind/core"]

[tool.hatch.build.targets.wheel.sources]
src = ""  # suggested by the ai because the hatching .pth file is not pointing to the correct location.

## reason :- we have to evict the src !! from the root we want to make the namespace instead as the root !! 
# "src" = ""
# │      │
# │      └── "replace the prefix with... nothing (empty string)"
# └──────── "for any file whose path starts with this prefix"
#
# src/coldwind/core -> coldwind/core
#

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
