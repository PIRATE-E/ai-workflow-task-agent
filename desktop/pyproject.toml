[project]
name = "coldwind-desktop"
version = "1.9.1"
description = "Cold Wind AI — desktop CLI application"
requires-python = ">=3.13"
dependencies = [
    "coldwind-core",
    "prompt-toolkit>=3.0.51",
    "rich>=14.1.0",
    "colorama>=0.4.6",
    "pygments>=2.19.2",
    "wcwidth>=0.2.13",
    "psutil>=7.0.0",
    "browser-use[video]>=0.7.7",   # ← flagged judgment call, see Section 3
]

[tool.uv.sources]
coldwind-core = { workspace = true }

[project.scripts]
coldwind = "coldwind.desktop.main_orchestrator:run"   # TODO the current entry point is a placeholeder. run using `python -m coldwind.desktop.main_orchestrator` until the entry point is finalized.

[tool.hatch.build.targets.wheel]
packages = ["src/coldwind/desktop"]

[tool.hatch.build.targets.wheel.sources]
src = ""  # suggested by the ai because the hatching .pth file is not pointing to the correct location.  it must be pointed above the namespace directory which is 'src'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
