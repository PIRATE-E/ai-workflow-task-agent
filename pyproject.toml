[project]
name = "cold-wind-ai"
version = "1.9.1"
description = "Cold Wind AI — multi-platform AI agent with MCP tool execution"
readme = "README.md"
requires-python = ">=3.13"
# dependencies = # Root has no runtime dependencies of its own — each member declares its own.

[tool.uv.workspace]
members = ["core", "desktop", "server"]

[tool.uv.sources]
coldwind-core = { workspace = true }


[tool.ruff]
lint.select = ["PTH", "ASYNC", "UP028"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
